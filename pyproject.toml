[project]
name = "zmanim-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Benyamin Ginzburg", email = "benyomin.94@gmail.com"},
]
dependencies = [
    "fastapi==0.104.0",
    "pydantic==2.4.2",
    "uvicorn==0.23.2",
    "arrow==1.2.3",
    "timezonefinder==8.2.1",
    "zmanim==0.3.1",
    "betterlogging==0.2.1",
    "sentry-sdk==1.32.0",
    "tzdata"
]
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = {text = "GPL-3.0"}

[project.scripts]
tests = "zmanim_api.scripts:tests"
xml = "zmanim_api.scripts:xml"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = [
    "pytest==7.4.2",
    "httpx==0.25.0",
    "coverage==7.2.3",
]

[tool.uv]
default-groups = ["test"]

[tool.hatch.build.targets.wheel]
packages = ["zmanim_api"]
